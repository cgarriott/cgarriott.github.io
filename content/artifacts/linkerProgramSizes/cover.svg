<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Stylized line chart of inflation-linked bond program shares moving independently by country, labeled with country codes.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141924"/>
      <stop offset="100%" stop-color="#1b2436"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#2a78d6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2a78d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141924" stop-opacity="0"/>
      <stop offset="100%" stop-color="#141924" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)"/>

  <!-- gridlines -->
  <g stroke="#ffffff" stroke-opacity="0.07">
    <line x1="140" y1="140" x2="980" y2="140"/>
    <line x1="140" y1="253" x2="980" y2="253"/>
    <line x1="140" y1="367" x2="980" y2="367"/>
    <line x1="140" y1="480" x2="980" y2="480"/>
  </g>
  <line x1="140" y1="560" x2="980" y2="560" stroke="#9aa4b2" stroke-opacity="0.35"/>

  <!-- y-axis labels -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#9aa4b2" text-anchor="end">
    <text x="128" y="144">30%</text>
    <text x="128" y="257">20%</text>
    <text x="128" y="371">10%</text>
    <text x="128" y="564">0%</text>
  </g>

  <!-- x-axis labels -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#9aa4b2" text-anchor="middle">
    <text x="140" y="592">2000</text>
    <text x="350" y="592">2006</text>
    <text x="560" y="592">2012</text>
    <text x="770" y="592">2018</text>
    <text x="960" y="592">2024</text>
  </g>

  <!-- line fan: stylized, not literal data. Each series is an independent
       AR(1) path (random start level, random long-run mean, high
       persistence) rather than a uniform smooth climb, since real program
       shares drift, plateau, and diverge rather than co-moving upward. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140.0,554.2 L173.6,545.3 L207.2,548.3 L240.8,523.4 L274.4,489.8 L308.0,446.6 L341.6,459.0 L375.2,471.5 L408.8,439.1 L442.4,415.6 L476.0,371.9 L509.6,354.3 L543.2,354.5 L576.8,356.8 L610.4,322.4 L644.0,328.8 L677.6,340.7 L711.2,355.8 L744.8,353.3 L778.4,350.4 L812.0,354.1 L845.6,353.8 L879.2,349.2 L912.8,339.8 L946.4,326.3 L980.0,325.8" stroke="#1baf7a" stroke-width="3.5"/>
    <path d="M140.0,294.7 L173.6,315.5 L207.2,340.3 L240.8,341.2 L274.4,353.0 L308.0,349.4 L341.6,302.2 L375.2,308.4 L408.8,301.1 L442.4,325.5 L476.0,332.3 L509.6,324.7 L543.2,328.8 L576.8,325.8 L610.4,327.0 L644.0,343.8 L677.6,336.2 L711.2,349.1 L744.8,322.3 L778.4,332.6 L812.0,324.6 L845.6,327.4 L879.2,316.3 L912.8,328.6 L946.4,316.7 L980.0,322.2" stroke="#2a78d6" stroke-width="3.5"/>
    <path d="M140.0,554.2 L173.6,556.1 L207.2,533.6 L240.8,519.5 L274.4,484.7 L308.0,492.5 L341.6,481.7 L375.2,473.0 L408.8,469.7 L442.4,468.2 L476.0,467.4 L509.6,481.6 L543.2,502.0 L576.8,508.2 L610.4,494.8 L644.0,465.4 L677.6,449.8 L711.2,434.5 L744.8,426.4 L778.4,420.7 L812.0,425.6 L845.6,418.7 L879.2,393.4 L912.8,411.3 L946.4,434.0 L980.0,403.4" stroke="#eb6834" stroke-width="3"/>
    <path d="M140.0,554.2 L173.6,510.4 L207.2,442.3 L240.8,398.2 L274.4,398.0 L308.0,383.9 L341.6,386.6 L375.2,413.4 L408.8,418.3 L442.4,410.9 L476.0,386.5 L509.6,374.9 L543.2,380.3 L576.8,359.2 L610.4,381.5 L644.0,368.5 L677.6,356.5 L711.2,366.5 L744.8,417.3 L778.4,440.9 L812.0,434.1 L845.6,421.1 L879.2,385.1 L912.8,414.9 L946.4,416.9 L980.0,403.1" stroke="#eda100" stroke-width="3"/>
    <path d="M140.0,223.9 L173.6,233.7 L207.2,221.8 L240.8,243.0 L274.4,253.4 L308.0,252.0 L341.6,213.3 L375.2,210.2 L408.8,215.8 L442.4,196.8 L476.0,207.3 L509.6,184.3 L543.2,206.2 L576.8,222.0 L610.4,216.2 L644.0,199.4 L677.6,197.3 L711.2,201.4 L744.8,240.1 L778.4,255.8 L812.0,268.0 L845.6,277.5 L879.2,267.1 L912.8,273.4 L946.4,260.2 L980.0,260.3" stroke="#5c6bc0" stroke-width="3"/>
    <path d="M140.0,300.3 L173.6,303.0 L207.2,314.0 L240.8,320.7 L274.4,340.2 L308.0,321.6 L341.6,307.1 L375.2,314.0 L408.8,323.6 L442.4,341.3 L476.0,339.8 L509.6,338.1 L543.2,312.8 L576.8,313.9 L610.4,327.2 L644.0,359.0 L677.6,340.5 L711.2,338.9 L744.8,359.2 L778.4,355.5 L812.0,378.5 L845.6,328.5 L879.2,317.2 L912.8,313.8 L946.4,319.8 L980.0,348.8" stroke="#e87ba4" stroke-width="3"/>
    <path d="M140.0,314.0 L173.6,337.0 L207.2,344.3 L240.8,315.8 L274.4,283.7 L308.0,301.8 L341.6,323.6 L375.2,303.1 L408.8,285.5 L442.4,300.3 L476.0,308.5 L509.6,315.6 L543.2,330.1 L576.8,334.4 L610.4,306.6 L644.0,291.3 L677.6,255.3 L711.2,258.9 L744.8,262.9 L778.4,280.3 L812.0,281.5 L845.6,302.1 L879.2,327.8 L912.8,309.8 L946.4,281.8 L980.0,267.0" stroke="#8e44ad" stroke-width="3"/>
  </g>

  <!-- crosshair + hover marker, echoing the interactive chart's hover state -->
  <line x1="700" y1="90" x2="700" y2="560" stroke="#c9d1db" stroke-opacity="0.4" stroke-dasharray="4 5"/>
  <circle cx="700" cy="344.8" r="6" fill="#2a78d6" stroke="#141924" stroke-width="2"/>

  <!-- end dots + two-letter country-code callouts (label y nudged apart to
       avoid overlap, same declutter idea as the real chart's end-labels) -->
  <g>
    <circle cx="980.0" cy="325.8" r="5" fill="#1baf7a" stroke="#141924" stroke-width="2"/>
    <circle cx="980.0" cy="322.2" r="5" fill="#2a78d6" stroke="#141924" stroke-width="2"/>
    <circle cx="980.0" cy="403.4" r="5" fill="#eb6834" stroke="#141924" stroke-width="2"/>
    <circle cx="980.0" cy="403.1" r="5" fill="#eda100" stroke="#141924" stroke-width="2"/>
    <circle cx="980.0" cy="260.3" r="5" fill="#5c6bc0" stroke="#141924" stroke-width="2"/>
    <circle cx="980.0" cy="348.8" r="5" fill="#e87ba4" stroke="#141924" stroke-width="2"/>
    <circle cx="980.0" cy="267.0" r="5" fill="#8e44ad" stroke="#141924" stroke-width="2"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="700">
    <text x="994.0" y="266.3" fill="#5c6bc0">JP</text>
    <text x="994.0" y="290.3" fill="#8e44ad">IT</text>
    <text x="994.0" y="328.2" fill="#2a78d6">US</text>
    <text x="994.0" y="352.2" fill="#1baf7a">DE</text>
    <text x="994.0" y="376.2" fill="#e87ba4">GB</text>
    <text x="994.0" y="409.1" fill="#eda100">CA</text>
    <text x="994.0" y="433.1" fill="#eb6834">FR</text>
  </g>

  <rect x="0" y="460" width="1200" height="170" fill="url(#scrim)"/>
</svg>
