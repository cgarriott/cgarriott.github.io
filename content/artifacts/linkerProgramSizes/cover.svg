<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Stylized line chart of rising inflation-linked bond program shares, labeled with country codes.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141924"/>
      <stop offset="100%" stop-color="#1b2436"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#2a78d6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2a78d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141924" stop-opacity="0"/>
      <stop offset="100%" stop-color="#141924" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#glow)"/>

  <!-- gridlines -->
  <g stroke="#ffffff" stroke-opacity="0.07">
    <line x1="140" y1="140" x2="980" y2="140"/>
    <line x1="140" y1="253" x2="980" y2="253"/>
    <line x1="140" y1="367" x2="980" y2="367"/>
    <line x1="140" y1="480" x2="980" y2="480"/>
  </g>
  <line x1="140" y1="560" x2="980" y2="560" stroke="#9aa4b2" stroke-opacity="0.35"/>

  <!-- y-axis labels -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#9aa4b2" text-anchor="end">
    <text x="128" y="144">30%</text>
    <text x="128" y="257">20%</text>
    <text x="128" y="371">10%</text>
    <text x="128" y="564">0%</text>
  </g>

  <!-- x-axis labels -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#9aa4b2" text-anchor="middle">
    <text x="140" y="592">2000</text>
    <text x="350" y="592">2006</text>
    <text x="560" y="592">2012</text>
    <text x="770" y="592">2018</text>
    <text x="960" y="592">2024</text>
  </g>

  <!-- line fan: stylized, not literal data -- straight annual segments (like
       the real chart's line-path rendering) with uneven, non-monotonic
       slopes rather than a uniform smooth climb, since real program growth
       is lumpy: flat stretches, the odd dip, occasional sharp jumps. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140,565 L245,560 L350,555 L455,560 L560,545 L665,520 L770,480 L875,450 L980,420" stroke="#8e44ad" stroke-width="3"/>
    <path d="M140,555 L245,550 L350,545 L455,530 L560,500 L665,480 L770,440 L875,400 L980,340" stroke="#e87ba4" stroke-width="3"/>
    <path d="M140,545 L245,540 L350,520 L455,500 L560,470 L665,450 L770,400 L875,350 L980,300" stroke="#5c6bc0" stroke-width="3"/>
    <path d="M140,540 L245,545 L350,530 L455,500 L560,460 L665,430 L770,350 L875,290 L980,240" stroke="#eb6834" stroke-width="3"/>
    <path d="M140,530 L245,500 L350,460 L455,470 L560,430 L665,380 L770,330 L875,290 L980,260" stroke="#eda100" stroke-width="3"/>
    <path d="M140,520 L245,515 L350,500 L455,460 L560,400 L665,340 L770,260 L875,205 L980,160" stroke="#2a78d6" stroke-width="3.5"/>
    <path d="M140,500 L245,495 L350,470 L455,430 L560,350 L665,290 L770,230 L875,165 L980,120" stroke="#1baf7a" stroke-width="3.5"/>
  </g>

  <!-- crosshair + hover marker, echoing the interactive chart's hover state -->
  <line x1="700" y1="90" x2="700" y2="560" stroke="#c9d1db" stroke-opacity="0.4" stroke-dasharray="4 5"/>
  <circle cx="700" cy="313" r="6" fill="#2a78d6" stroke="#141924" stroke-width="2"/>

  <!-- end dots + two-letter country-code callouts -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="19" font-weight="700">
    <circle cx="980" cy="120" r="5" fill="#1baf7a" stroke="#141924" stroke-width="2"/>
    <text x="994" y="126" fill="#1baf7a">DE</text>

    <circle cx="980" cy="160" r="5" fill="#2a78d6" stroke="#141924" stroke-width="2"/>
    <text x="994" y="166" fill="#2a78d6">US</text>

    <circle cx="980" cy="240" r="5" fill="#eb6834" stroke="#141924" stroke-width="2"/>
    <text x="994" y="246" fill="#eb6834">FR</text>

    <circle cx="980" cy="260" r="5" fill="#eda100" stroke="#141924" stroke-width="2"/>
    <text x="994" y="278" fill="#eda100">CA</text>

    <circle cx="980" cy="300" r="5" fill="#5c6bc0" stroke="#141924" stroke-width="2"/>
    <text x="994" y="306" fill="#5c6bc0">JP</text>

    <circle cx="980" cy="340" r="5" fill="#e87ba4" stroke="#141924" stroke-width="2"/>
    <text x="994" y="346" fill="#e87ba4">GB</text>

    <circle cx="980" cy="420" r="5" fill="#8e44ad" stroke="#141924" stroke-width="2"/>
    <text x="994" y="426" fill="#8e44ad">IT</text>
  </g>

  <rect x="0" y="460" width="1200" height="170" fill="url(#scrim)"/>
</svg>
