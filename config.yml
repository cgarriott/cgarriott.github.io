baseURL: "https://cgarriott.github.io/"
title: Corey Garriott
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

# No tag pages or tag pills; the tags front matter still drives the papers/media filters.
disableKinds: ["taxonomy", "term"]

menu:
    main:
        - name: Papers
          url: papers/
          weight: 10
        - name: Codes
          url: codes/
          weight: 20
        - name: Media
          url: media/
          weight: 30
        - name: Artifacts
          url: artifacts/
          weight: 40
        - name: CV
          url: cv/
          weight: 40

params:
    description: "This website hosts Corey Garriott's research papers, codes, curriculum vitae, and contact information."
    author: Corey Garriott
    googleAnalyticsID: "G-CLH46C01N2"
    DateFormat: "2006-01-02"
    defaultTheme: dark
    disableThemeToggle: false
    hideFooter: false
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["papers","codes","cv"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Corey Garriott
          subtitle: >
            I research <a href="https://en.wikipedia.org/wiki/Financial_market">financial markets</a> for the <a href="http://financialresearch.gov">Office of Financial Research</a> at <a href="ht[...]"